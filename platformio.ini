; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Libraries optimized for Ultimate GPS Breakout v3 (MTK3339)
lib_deps = 
	mikalhart/TinyGPSPlus@^1.1.0    ; Enhanced GPS parsing library
    adafruit/Adafruit BNO055 @ ^1.6.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    Wire

; Build configuration for Ultimate GPS v3
build_flags = 
	-DULTIMATE_GPS_V3=1             ; Enable Ultimate GPS v3 specific features
	-DMTK3339_CHIPSET=1             ; MTK3339 chipset identification
	-DGPS_ENHANCED_PRECISION=1      ; Enable high precision GPS calculations

; Monitor configuration for GPS debugging
monitor_speed = 9600
monitor_filters = 
	esp32_exception_decoder         ; Decode stack traces
	time                           ; Add timestamps to serial output

; Upload configuration
upload_speed = 921600

; Advanced configuration for GPS applications
board_build.partitions = huge_app.csv  ; Larger app partition for GPS logging features